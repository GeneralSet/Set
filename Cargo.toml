[package]
name = "set"
version = "0.1.0"
resolver = "2"
authors = ["Tim <generalSet@timothy.best>"]
description = "Internal game logic for set"
license = "MIT/Apache-2.0"
repository = "https://github.com/GeneralSet/Set"
readme = "README.md"
include = ["Cargo.toml", "src/**/*.rs", "README.md"]

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
wasm-bindgen = "0.2"
getrandom = { version = "^0.3.3", features = ["wasm_js"] }
rand = "*"